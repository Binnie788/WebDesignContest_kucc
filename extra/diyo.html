<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <script>

        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        let W = 0, H = 0, U = 0, DPR = 1;

        function resize() {
            const w = window.innerWidth, h = window.innerHeight;
            if (W === w && Math.abs(H - h) < 120) return;        // ignore phone address-bar wobble
            W = w; H = h; U = Math.min(H, W * 0.7);
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
        }
        window.addEventListener('resize', resize); resize();


        function ell(x, y, rx, ry, c) {// filled oval/circle
            ctx.fillStyle = c;                          // pick the colour
            ctx.beginPath();                            // start a new shape
            ctx.ellipse(x, y, rx, ry, 0, 0, 7);         // describe an oval
            ctx.fill();                                 // paint it
        }

        function diya(x, y, u, t, ph) {                                 // clay diyo + flickering flame. (x,y)=rim, u=half width
            ctx.fillStyle = '#8a3a14';
            ctx.beginPath();
            ctx.ellipse(x, y, u, u * .9, 0, 0, Math.PI);
            ctx.fill();   // bowl
            ell(x, y, u, u * .28, '#c4622a');
            ell(x, y + u * .02, u * .8, u * .18, '#3a1405');                                // rim + oil
            const f = 1 + .08 * Math.sin(t * 9 + ph) + .05 * Math.sin(t * 14 + ph * 2), s = u * .55, h = s * 1.5 * f;
            ctx.globalCompositeOperation = 'lighter';
            const g = ctx.createRadialGradient(x, y, 0, x, y, s * 5); g.addColorStop(0, 'rgba(255,170,40,.5)'); g.addColorStop(1, 'rgba(255,120,0,0)');
            ctx.fillStyle = g; ctx.fillRect(x - s * 5, y - s * 5, s * 10, s * 10);                                          // glow
            ctx.globalCompositeOperation = 'source-over';
            const fg = ctx.createLinearGradient(0, y - h, 0, y + s * .3); fg.addColorStop(0, '#ffe9a0'); fg.addColorStop(.5, '#ffa31a'); fg.addColorStop(1, '#d93b00');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.quadraticCurveTo(x + s * .7, y - h * .2, x, y + s * .25); ctx.quadraticCurveTo(x - s * .7, y - h * .2, x, y - h); ctx.fill();   // flame
            ell(x, y - s * .1, s * .15, s * .4, '#fff6d0');                                                                      // hot core
        }

        /* ===== preview loop ===== */
        function frame() {
            const t = Date.now() / 1000;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.clearRect(0, 0, W, H);
            diya(W / 2, H * .6, U * .2, t, 0);      // x, y, size, time, flicker phase
            window.requestAnimationFrame(frame);
        }
        frame();
    </script>
</body>

</html>
